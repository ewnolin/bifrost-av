version: 2
updates:
  - package-ecosystem: gradle
    directories:
      - "/"
      - "/buildSrc"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    labels: ["chore"]
    groups:
      gradle-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"
    labels: ["chore"]
