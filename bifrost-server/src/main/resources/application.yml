spring:
  application:
    name: bifrost-server

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html

bifrost:
  session:
    ttl: 5m
    allowed-min-ages: [13, 15, 16, 18]
---
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    io.github.ewnolin.bifrost: DEBUG
